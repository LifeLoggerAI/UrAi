name: One-shot current-main legacy quarantine

on:
  push:
    branches:
      - chore/quarantine-current-main-20260729
    paths:
      - .github/workflows/one-shot-current-main-quarantine.yml
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/one-shot-current-main-quarantine.yml

permissions:
  contents: write

concurrency:
  group: one-shot-current-main-legacy-quarantine
  cancel-in-progress: false

jobs:
  quarantine:
    if: github.repository == 'LifeLoggerAI/UrAi'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TARGET_BRANCH: chore/quarantine-current-main-20260729
      EXPECTED_HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      CURRENT_MAIN_SHA: 658b36da6b239333a918396251aad6386894e78f
      HISTORICAL_QUARANTINE_SHA: b08490ec27245481ae8d163604ea2403eee0c3de
    steps:
      - name: Check out exact current-main branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ env.TARGET_BRANCH }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false
          lfs: false

      - name: Verify immutable source authorities
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          git fetch --no-tags origin "$HISTORICAL_QUARANTINE_SHA"

          actual_head="$(git rev-parse HEAD)"
          actual_main="$(git rev-parse origin/main)"
          dirty="$(git status --porcelain --untracked-files=all)"
          printf 'expectedHead=%s\nactualHead=%s\nexpectedMain=%s\nactualMain=%s\n' \
            "$EXPECTED_HEAD" "$actual_head" "$CURRENT_MAIN_SHA" "$actual_main"

          if [ "$actual_head" != "$EXPECTED_HEAD" ]; then
            echo "Refusing stale branch checkout" >&2
            exit 1
          fi
          if [ "$actual_main" != "$CURRENT_MAIN_SHA" ]; then
            echo "Canonical legacy main moved; re-audit required" >&2
            exit 1
          fi
          if ! git merge-base --is-ancestor "$CURRENT_MAIN_SHA" "$actual_head"; then
            echo "Current main is not an ancestor of the quarantine candidate" >&2
            exit 1
          fi
          if ! git cat-file -e "$HISTORICAL_QUARANTINE_SHA^{commit}"; then
            echo "Historical reviewed quarantine commit is unavailable" >&2
            exit 1
          fi
          if [ -n "$dirty" ]; then
            printf 'Dirty checkout before mutation:\n%s\n' "$dirty" >&2
            exit 1
          fi

      - name: Transplant only reviewed quarantine controls
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .gitattributes
            .github/workflows/audit-home-xr-proof-chain.yml
            .github/workflows/ci.yml
            .github/workflows/deploy-home-xr.yml
            .github/workflows/deploy-urai-app.yml
            .github/workflows/deploy-urai.yml
            .github/workflows/firebase-production-deploy.yml
            .github/workflows/legacy-production-authority-guard.yml
            .github/workflows/life-map-quest-production-evidence.yml
            .github/workflows/p1-release-gate.yml
            .github/workflows/post-deploy-verify.yml
            .github/workflows/production-evidence.yml
            .github/workflows/qa.yml
            .github/workflows/urai-launch-gate.yml
            .github/workflows/webxr-foundation-audit.yml
            README.md
            docs/LEGACY_QUARANTINE_AUTHORITY.md
            docs/TIER_2_ACCESS_LOCKS.md
            docs/URAI_LAUNCH_BLOCKER_MATRIX.md
            docs/WEBXR_ROUTE_HANDOFF.md
            scripts/check-home-xr-deploy-workflow.mjs
            scripts/check-home-xr-launch-evidence-consistency.mjs
            scripts/check-home-xr-lock.mjs
            scripts/check-legacy-production-authority-boundary.mjs
            scripts/check-production-claims.mjs
            scripts/check-public-copy.mjs
            scripts/check-system-registry.mjs
            scripts/check-webxr-foundation-release-readiness.mjs
            scripts/deploy-urai-firebase.sh
            system/canonical-authority.json
          )
          git checkout "$HISTORICAL_QUARANTINE_SHA" -- "${files[@]}"

          cat > .firebaserc <<'JSON'
          {
            "projects": {},
            "targets": {},
            "etags": {}
          }
          JSON

          cat > firebase.json <<'JSON'
          {
            "emulators": {
              "firestore": {
                "port": 8080
              }
            }
          }
          JSON

          python3 - <<'PY'
          from pathlib import Path
          guard = Path('scripts/check-legacy-production-authority-boundary.mjs')
          source = guard.read_text()
          marker = 'console.log("legacy-authority: canonical Spatial authority and fail-closed legacy boundary verified");'
          addition = '''const firebaseRc = JSON.parse(requireFile(".firebaserc"));
          if (Object.keys(firebaseRc.projects ?? {}).length !== 0) {
            throw new Error("Legacy .firebaserc must not map any project alias");
          }

          const firebaseConfig = JSON.parse(requireFile("firebase.json"));
          for (const deployable of ["hosting", "firestore", "functions", "storage", "apphosting"]) {
            if (Object.prototype.hasOwnProperty.call(firebaseConfig, deployable)) {
              throw new Error(`Legacy firebase.json must not expose deployable ${deployable} configuration`);
            }
          }

          const launchVerify = requireFile(".github/workflows/urai-launch-verify.yml");
          for (const forbidden of ["firebase deploy", "firebase-tools deploy", "urai-4dc1d", "secrets.", "SERVICE_ACCOUNT"]) {
            if (launchVerify.includes(forbidden)) throw new Error(`Verification-only workflow contains forbidden production token: ${forbidden}`);
          }

          ''' + marker
          if marker not in source:
              raise SystemExit('legacy authority guard completion marker not found')
          guard.write_text(source.replace(marker, addition))
          PY

          cat > docs/LEGACY_CURRENT_MAIN_QUARANTINE_RECEIPT_2026-07-29.md <<'EOF'
          # Current-main legacy quarantine receipt

          - Repository: `LifeLoggerAI/UrAi`
          - Starting current main: `658b36da6b239333a918396251aad6386894e78f`
          - Historical reviewed quarantine source: `b08490ec27245481ae8d163604ea2403eee0c3de`
          - Canonical public authority: `LifeLoggerAI/urai-spatial` -> `urai-tier1` -> `main` -> `urai.app`

          This reconciliation preserves the two current-main launch-shell commits while selectively transplanting only reviewed quarantine workflows, authority guards, deployment-denial scripts, canonical-authority records, and legacy documentation. It does not merge the historical divergent product tree.

          Source containment additionally removes every Firebase project alias from `.firebaserc` and every deployable Hosting, Firestore, Functions, Storage, and App Hosting section from `firebase.json`. Production deployment package aliases remain fail-closed. The new `URAI Launch Verify` workflow remains verification-only and may not read production secrets or deploy infrastructure.

          Repository settings, environments, secrets, deploy keys, installed apps, webhooks, historic artifacts, provider credentials, and credential revocation remain administrator-side gates outside source control.
          EOF

          git rm .github/workflows/one-shot-current-main-quarantine.yml
          git diff --check

      - name: Verify fail-closed current tree
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .github/workflows/deploy.yml
          test ! -e .github/workflows/firebase-hosting-live.yml
          ! grep -R -n 'urai-4dc1d' .github/workflows .firebaserc firebase.json scripts/deploy-urai-firebase.sh
          ! grep -R -E -n 'firebase(-tools)?[[:space:]]+deploy|gcloud[[:space:]]+(run|app)[[:space:]]+deploy|vercel[[:space:]]+(deploy|--prod)' \
            .github/workflows/deploy-home-xr.yml \
            .github/workflows/deploy-urai-app.yml \
            .github/workflows/deploy-urai.yml \
            .github/workflows/firebase-production-deploy.yml \
            .github/workflows/p1-release-gate.yml \
            .github/workflows/production-evidence.yml \
            .github/workflows/life-map-quest-production-evidence.yml \
            .github/workflows/post-deploy-verify.yml \
            scripts/deploy-urai-firebase.sh
          node scripts/check-legacy-production-authority-boundary.mjs
          node scripts/check-home-xr-deploy-workflow.mjs
          node scripts/check-home-xr-launch-evidence-consistency.mjs
          node scripts/check-system-registry.mjs
          node -e "const p=require('./package.json'); for (const k of ['deploy','deploy:rules','deploy:hosting','ship:urai','ship:urai:prod']) { if (!String(p.scripts[k]).includes('block-legacy-production-deploy.mjs')) throw new Error(k+' is not blocked') }"
          git diff --cached --name-status > /tmp/quarantine-files.txt
          test -s /tmp/quarantine-files.txt

      - name: Commit and publish containment candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: quarantine legacy production authority on current main"
          git push origin "HEAD:$TARGET_BRANCH"
