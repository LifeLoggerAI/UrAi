name: URAI Council v3 Freeze Validation

on:
  push:
    branches: [agent/frontier-benchmark-harness]
    paths:
      - ".github/workflows/frontier-benchmark-matched-compute.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate frozen synthetic suite
        run: node scripts/bench/generate-long-horizon-v2.mjs bench/suites/urai-long-horizon-v2.jsonl

      - name: Validate safe typed v3 harness
        run: |
          node --test scripts/bench/v3/gate.test.mjs
          node --check scripts/bench/v3/harnesses.mjs
          node --check scripts/bench/v3/run-freeze-validation.mjs

      - name: Run fresh stochastic freeze validation
        run: |
          node scripts/bench/v3/run-freeze-validation.mjs \
            --run-id ci-v3-freeze-validation \
            --repeats 2 \
            --max-output-tokens 1200

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-benchmark-evidence-v3-freeze-validation
          path: |
            bench/results/ci-v3-freeze-validation/
            bench/suites/urai-long-horizon-v2.jsonl
          if-no-files-found: error
