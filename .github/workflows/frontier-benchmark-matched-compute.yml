name: URAI Development Candidate Benchmark

on:
  push:
    branches: [agent/frontier-benchmark-harness]
    paths:
      - ".github/workflows/frontier-benchmark-matched-compute.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate frozen synthetic suite
        run: node scripts/bench/generate-long-horizon-v2.mjs bench/suites/urai-long-horizon-v2.jsonl

      - name: Test development candidates
        run: |
          node --test \
            scripts/bench/deterministic-output.test.mjs \
            scripts/bench/reduced-council.test.mjs \
            scripts/bench/selective-router.test.mjs \
            scripts/bench/preservation-gate.test.mjs \
            scripts/bench/providers.test.mjs
          node --check scripts/bench/run-dev-candidates.mjs
          node --check scripts/bench/select-router-threshold.mjs

      - name: Run development candidate comparison
        run: |
          node scripts/bench/run-dev-candidates.mjs \
            --run-id ci-dev-candidates-v3 \
            --repeats 1 \
            --max-output-tokens 1200

      - name: Select router threshold with leave-one-family-out checks
        if: success()
        run: |
          node scripts/bench/select-router-threshold.mjs \
            --trials bench/results/ci-dev-candidates-v3/trials.jsonl \
            --output bench/results/ci-dev-candidates-v3/router-selection.json

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-benchmark-evidence-dev-candidates-v3
          path: |
            bench/results/ci-dev-candidates-v3/
            bench/suites/urai-long-horizon-v2.jsonl
          if-no-files-found: error
