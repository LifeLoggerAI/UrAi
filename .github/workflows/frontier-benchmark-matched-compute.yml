name: URAI Matched Compute Benchmark

on:
  push:
    branches: [agent/frontier-benchmark-harness]
    paths:
      - ".github/workflows/frontier-benchmark-matched-compute.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate frozen synthetic suite
        run: node scripts/bench/generate-long-horizon-v2.mjs bench/suites/urai-long-horizon-v2.jsonl

      - name: Validate Council v3 development harness
        run: |
          node --check scripts/bench/v3/canonicalizer.mjs
          node --check scripts/bench/v3/gate.mjs
          node --check scripts/bench/v3/harnesses.mjs
          node --check scripts/bench/v3/run-development-selection.mjs

      - name: Run Council v3 development selection
        run: |
          node scripts/bench/v3/run-development-selection.mjs \
            --run-id ci-council-v3-dev-selection \
            --max-output-tokens 1200

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontier-benchmark-evidence-council-v3-dev-selection
          path: |
            bench/results/ci-council-v3-dev-selection/
            bench/suites/urai-long-horizon-v2.jsonl
          if-no-files-found: error
