name: URAI v2 Contract-Aware Development Validation

on:
  push:
    branches: [agent/frontier-benchmark-harness]
    paths:
      - ".github/workflows/frontier-benchmark-matched-compute.yml"
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_BENCH_MODEL: gpt-4o-mini
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Generate development suite
        run: node scripts/bench/generate-long-horizon-v2.mjs bench/suites/urai-long-horizon-v2.jsonl

      - name: Validate v2 contract-aware harness
        run: |
          node --test scripts/bench/v3/canonicalizer.test.mjs scripts/bench/v3/gate.test.mjs
          node --check scripts/bench/v3/harnesses.mjs
          node --check scripts/bench/v3/run-development-selection.mjs

      - name: Run fresh v2 development comparison
        run: |
          node scripts/bench/v3/run-development-selection.mjs \
            --run-id ci-v2-contract-dev \
            --repeats 1 \
            --max-output-tokens 1200

      - name: Upload development evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: urai-v2-contract-dev-evidence
          path: |
            bench/results/ci-v2-contract-dev/
            bench/suites/urai-long-horizon-v2.jsonl
          if-no-files-found: error
